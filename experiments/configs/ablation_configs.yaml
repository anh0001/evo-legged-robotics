# experiments/configs/ablation_configs.yaml
# Configuration for systematic ablation studies

experimental_design:
  name: "Structural Mutation Operator Ablation Study"
  description: "Systematic evaluation of insertion, deletion, phase exchange, and order exchange operators"
  
  # Statistical parameters
  significance_level: 0.05
  target_power: 0.80
  min_effect_size: 0.5  # Cohen's d
  
  # Replication parameters
  independent_runs_per_config: 30
  total_configurations: 12
  
# VEGA Algorithm Parameters
vega_config:
  population_size: 30
  chromosome_length: 8  # Expanded from 4 for better operator testing
  max_iterations: 500
  
  # Enhanced fitness objectives
  fitness_weights:
    forward_motion: 1.0
    stability: 2.0        # High priority for preventing vibrations
    energy_efficiency: 0.5
    smoothness: 1.5       # High priority for smooth locomotion
    direction_control: 1.5
    foot_contact: 2.0

# Ablation Configurations (Table 3 from strategic guidance)
# UPDATED: Reduced mutation probabilities to prevent population disruption
ablation_configurations:
  C0_baseline:
    name: "Baseline (All Operators)"
    active_operators: ["insertion", "deletion", "phase_exchange", "order_exchange"]
    operator_probabilities:
      insertion: 0.05      # Reduced from 0.15
      deletion: 0.05       # Reduced from 0.15
      phase_exchange: 0.03 # Reduced from 0.10
      order_exchange: 0.03 # Reduced from 0.10
    description: "All four structural operators active (total mutation rate: 16%)"
    priority: 1

  C1_no_insertion:
    name: "No Insertion"
    active_operators: ["deletion", "phase_exchange", "order_exchange"]
    operator_probabilities:
      deletion: 0.05       # Reduced from 0.15
      phase_exchange: 0.03 # Reduced from 0.10
      order_exchange: 0.03 # Reduced from 0.10
    description: "Test impact of removing insertion operator (total mutation rate: 11%)"
    priority: 1

  C2_no_deletion:
    name: "No Deletion"
    active_operators: ["insertion", "phase_exchange", "order_exchange"]
    operator_probabilities:
      insertion: 0.05      # Reduced from 0.15
      phase_exchange: 0.03 # Reduced from 0.10
      order_exchange: 0.03 # Reduced from 0.10
    description: "Test impact of removing deletion operator (total mutation rate: 11%)"
    priority: 1

  C3_no_phase:
    name: "No Phase Exchange"
    active_operators: ["insertion", "deletion", "order_exchange"]
    operator_probabilities:
      insertion: 0.05      # Reduced from 0.15
      deletion: 0.05       # Reduced from 0.15
      order_exchange: 0.03 # Reduced from 0.10
    description: "Test impact of removing phase exchange operator (total mutation rate: 13%)"
    priority: 1

  C4_no_order:
    name: "No Order Exchange"
    active_operators: ["insertion", "deletion", "phase_exchange"]
    operator_probabilities:
      insertion: 0.05      # Reduced from 0.15
      deletion: 0.05       # Reduced from 0.15
      phase_exchange: 0.03 # Reduced from 0.10
    description: "Test impact of removing order exchange operator (total mutation rate: 13%)"
    priority: 1

  C5_exploration_only:
    name: "Exploration Only (I+D)"
    active_operators: ["insertion", "deletion"]
    operator_probabilities:
      insertion: 0.05      # Reduced from 0.15
      deletion: 0.05       # Reduced from 0.15
    description: "Test pure exploration hypothesis (total mutation rate: 10%)"
    priority: 2

  C6_refinement_only:
    name: "Refinement Only (P+O)"
    active_operators: ["phase_exchange", "order_exchange"]
    operator_probabilities:
      phase_exchange: 0.03 # Reduced from 0.10
      order_exchange: 0.03 # Reduced from 0.10
    description: "Test pure refinement hypothesis (total mutation rate: 6%)"
    priority: 2

  C7_insertion_phase:
    name: "Insertion + Phase"
    active_operators: ["insertion", "phase_exchange"]
    operator_probabilities:
      insertion: 0.05      # Reduced from 0.15
      phase_exchange: 0.03 # Reduced from 0.10
    description: "Test synergy between exploration and refinement (total mutation rate: 8%)"
    priority: 3

  C8_deletion_order:
    name: "Deletion + Order"
    active_operators: ["deletion", "order_exchange"]
    operator_probabilities:
      deletion: 0.05       # Reduced from 0.15
      order_exchange: 0.03 # Reduced from 0.10
    description: "Test alternative synergy combination (total mutation rate: 8%)"
    priority: 3

  C11_no_structural:
    name: "No Structural Mutations"
    active_operators: []
    operator_probabilities: {}
    description: "Critical control: only selection and crossover (total mutation rate: 0%)"
    priority: 1

# Robot and Simulation Parameters
robot_config:
  physics_params:
    time_step: 0.002      # Enhanced stability
    gravity: -9.81
    terrain_type: "flat"  # Start with flat terrain
  
  motor_control:
    kp: 10.0              # Position gain
    kd: 0.5               # Velocity gain (critical damping)
    max_force: 20.0       # Conservative force limit

# Statistical Analysis Configuration
statistical_tests:
  multivariate:
    - MANOVA              # Overall significance test
  
  univariate:
    - ANOVA               # Per-objective analysis
    - Tukey_HSD          # Post-hoc pairwise comparisons
  
  effect_sizes:
    - Cohens_d           # Standardized effect size
    - eta_squared        # Proportion of variance explained
  
  assumption_tests:
    - Shapiro_Wilk       # Normality testing
    - Levene             # Homogeneity of variance

# Output and Logging Configuration
output_config:
  base_directory: "results/ablation_study"
  data_formats: ["csv", "json", "hdf5"]
  plot_formats: ["png", "pdf", "svg"]
  
  logging:
    level: "INFO"
    detailed_operator_tracking: true
    fitness_history_frequency: 10  # Save every 10 generations
    checkpoint_frequency: 100      # Checkpoint every 100 generations

# Computational Resources
resource_config:
  parallel_execution: true
  max_concurrent_experiments: 8
  cpu_cores_per_experiment: 2
  memory_gb_per_experiment: 4
  estimated_runtime_hours: 72

# Publication Configuration  
publication_config:
  figure_specifications:
    format: "pdf"
    dpi: 300
    font_size: 12
    color_scheme: "publication"
  
  table_specifications:
    format: "latex"
    precision: 3
    statistical_symbols: true